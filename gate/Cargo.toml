[package]
name = "geyser-gate"
version = "0.1.0"
edition = "2024"
description = "Quality gate for Geyser Genomics runs: QC statistics against configurable thresholds, a JSON verdict and a pass/fail exit code"
license = "MIT"
publish = false

[[bin]]
name = "geyser-gate"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
# One small static-friendly binary for the image: no unwinding tables to ship, symbols stripped.
panic = "abort"
strip = true
lto = true
codegen-units = 1
