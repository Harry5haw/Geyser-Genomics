name: Tests

# Offline tests only: no AWS credentials, no OIDC, nothing deployed.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      no_cache:
        description: Build the images from scratch (ignore the layer cache)
        type: boolean
        default: false
  # Weekly from-scratch build: cached tool layers would otherwise hide a vanished mirror or download
  # URL, and would keep old security updates. It also refreshes main's cache.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  # Quality gates, no AWS: ruff (config in pyproject.toml) and Terraform formatting/validation.
  # validate runs with -backend=false: it downloads the providers but never touches state.
  lint:
    name: Lint (ruff, terraform fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff (version pinned in requirements-dev.txt)
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
      - name: terraform fmt -check
        run: terraform fmt -check -recursive
        working-directory: infrastructure
      - name: terraform validate
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: infrastructure

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  end-to-end:
    name: Pipeline end-to-end (Docker, synthetic data)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - uses: docker/setup-buildx-action@v4
      # Layers come from the GitHub Actions cache, so a change that only touches app/ skips the tool
      # installs. Only main writes the cache (pushes and the weekly rebuild); branches and PRs read
      # main's. That keeps one copy under the repo's 10 GB cache limit instead of one per ref.
      - name: Build geyser-app (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: geyser-app
          load: true
          no-cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}
          cache-from: type=gha,scope=geyser-app
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=geyser-app,mode=max' || '' }}
      - run: pytest tests/test_e2e_docker.py -v
        env:
          GEYSER_E2E: "1"

  # The state machine definition (infrastructure/state_machine.asl.json, the file Terraform renders)
  # run in Step Functions Local with Batch and SNS mocked: no AWS, no credentials.
  state-machine:
    name: State machine (Step Functions Local, mocked Batch/SNS)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/test_state_machine_local.py -v
        env:
          GEYSER_SFN_LOCAL: "1"

  # DeepVariant on the CPU image (runners have no GPU). Same commands and storage wiring as the GPU
  # image, so this catches integration breakage. Only on PRs and manual runs: the base image is a
  # ~2 GB pull. The GPU path is tested locally with GEYSER_GPU_E2E=1 before merging.
  deepvariant-cpu:
    name: DeepVariant end-to-end (CPU image, synthetic data)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - uses: docker/setup-buildx-action@v4
      # Reads the cache the end-to-end job writes on main.
      - name: Build geyser-app (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: geyser-app
          load: true
          no-cache: ${{ inputs.no_cache == true }}
          cache-from: type=gha,scope=geyser-app
      # Not cached: the ~2 GB base image dominates and our two layers on top are small, so exporting
      # the image out of Buildx would cost more than the cache saves. Plain docker build on the daemon.
      - run: docker build -f app-deepvariant/Dockerfile --build-arg DV_TAG=1.10.0 -t geyser-deepvariant-cpu .
      - run: pytest tests/test_e2e_deepvariant.py -v
        env:
          GEYSER_DV_E2E: "1"
