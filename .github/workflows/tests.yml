name: Tests

# Offline tests only: no AWS credentials, no OIDC, nothing deployed.
on:
  # Branch pushes are covered by their pull request, so pushes run CI only on main: before this, every
  # push to a PR branch ran the whole suite twice (push + pull_request), which used up the private
  # repo's monthly Actions minutes in two days (2 Nov 2026).
  push:
    branches: [main]
  pull_request:
    # ready_for_review: draft PRs skip the heavy jobs below, so they run in full when marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      no_cache:
        description: Build the images from scratch (ignore the layer cache)
        type: boolean
        default: false
  # Weekly from-scratch build: cached tool layers would otherwise hide a vanished mirror or download
  # URL, and would keep old security updates. It also refreshes main's cache.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

# A newer push to the same PR cancels its older, now pointless run. Runs on main are never cancelled,
# so every merge commit gets a complete result.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only PRs (markdown anywhere, or anything under docs/: figures, CSVs) skip the heavy jobs below: the
  # Rust gate, the Docker end-to-end suites and Step Functions Local, which can't be affected by them. Lint and
  # the unit tests still run (some unit tests read docs/). A skipped job counts as passed for the ruleset's
  # required checks, so such a PR is mergeable in ~2 minutes instead of ~8.
  # Fail-safe: each heavy job runs unless this job SUCCEEDED and said docs_only=true, so a failure here means
  # the full suite runs, never that it is skipped. Pushes to main, the weekly run and manual runs never skip.
  changes:
    name: Changed files (docs only?)
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -Evq '^docs/|\.md$'; then docs_only=true; else docs_only=false; fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

  # Quality gates, no AWS: ruff (config in pyproject.toml) and Terraform formatting/validation.
  # validate runs with -backend=false: it downloads the providers but never touches state.
  lint:
    name: Lint (ruff, terraform fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff (version pinned in requirements-dev.txt)
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
      - name: terraform fmt -check
        run: terraform fmt -check -recursive
        working-directory: infrastructure
      - name: terraform validate
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: infrastructure
      - name: terraform validate (account stack, user-applied)
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: infrastructure/account
      - name: terraform validate (web stack, user-applied)
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: infrastructure/web

  # The quality gate (gate/, Rust): formatting, clippy with warnings denied, tests, and the static
  # musl build the image will use. rustup on the runner installs the toolchain pinned in
  # gate/rust-toolchain.toml on first use.
  gate:
    name: Quality gate (Rust fmt, clippy, tests)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gate
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Static build (x86_64-unknown-linux-musl)
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl
          # Rust's musl target builds static-pie executables: `file` says "static-pie linked".
          file target/x86_64-unknown-linux-musl/release/geyser-gate | tee /dev/stderr | grep -Eq "static-pie linked|statically linked"

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest
      # The upload page's core (web/samples/static/samples/upload.js) under Node's built-in test runner: no npm,
      # no dependencies. The runner image's Node is enough (20+).
      - run: node --test web/tests/js/*.test.js

  # Cohort QC (Hail) and the run-record cohort table (PySpark, the Glue job's code) on tiny synthetic fixtures. A job of
  # its own because Hail's wheel is ~130 MB and Spark needs a JVM: the unit job skips these tests.
  cohort:
    name: Cohort QC (Hail, PySpark)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # On a PR, only when something the cohort code reads or is built from changed (it takes a few minutes for a
      # side analysis). Pushes to main, the weekly run and manual runs always run it. app/provenance.py defines the
      # record layout and the VCF keys these scripts read.
      - name: Cohort files changed?
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          pattern='^(scripts/cohort_|scripts/glue/|tests/test_cohort_|app-cohort/|requirements-(cohort|dev)\.txt$|app/provenance\.py$|\.github/workflows/tests\.yml$)'
          if echo "$files" | grep -Eq "$pattern"; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Hail 0.2.139 is built and tested with Java 11 (Glue 5.0 runs cohort_runs.py on 17: plain Spark, no Hail).
          java-version: "11"
      - if: steps.changed.outputs.run == 'true'
        run: pip install -r requirements-dev.txt -r requirements-cohort.txt
      - if: steps.changed.outputs.run == 'true'
        run: pytest tests/test_cohort_qc.py tests/test_cohort_runs.py -v -rs

  end-to-end:
    name: Pipeline end-to-end (Docker, synthetic data)
    # Skipped on draft PRs (the image build is the expensive part); runs when the PR is marked ready.
    # !cancelled() + the explicit unit check: see the changes job (a failed changes job must not skip this).
    if: >-
      ${{ !cancelled() && needs.unit.result == 'success' && needs.changes.outputs.docs_only != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    needs: [unit, changes]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - uses: docker/setup-buildx-action@v4
      # Layers come from the GitHub Actions cache, so a change that only touches app/ skips the tool
      # installs. Only main writes the cache (pushes and the weekly rebuild); branches and PRs read
      # main's. That keeps one copy under the repo's 10 GB cache limit instead of one per ref.
      - name: Build geyser-app (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: geyser-app
          load: true
          no-cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}
          cache-from: type=gha,scope=geyser-app
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=geyser-app,mode=max' || '' }}
      - run: pytest tests/test_e2e_docker.py -v
        env:
          GEYSER_E2E: "1"
      # The large route's S3 paths (presigned GETs, range reads, the ETag-verified index) against moto's S3 server,
      # with the same image (#231).
      - run: pytest tests/test_e2e_s3.py -v
        env:
          GEYSER_S3_E2E: "1"
      # The static publisher's image (W2): geyser-app + the web UI, a pip install on top, so it rides on this job's
      # geyser-app. FROM geyser-app is the image loaded above, which only the daemon's own builder can see.
      - run: docker buildx build --builder default --load -f app-publish/Dockerfile -t geyser-publish .
      - run: pytest tests/test_e2e_publish.py -v
        env:
          GEYSER_PUBLISH_E2E: "1"

  # The state machine definition (infrastructure/state_machine.asl.json, the file Terraform renders)
  # run in Step Functions Local with Batch and SNS mocked: no AWS, no credentials.
  state-machine:
    name: State machine (Step Functions Local, mocked Batch/SNS)
    if: ${{ !cancelled() && needs.unit.result == 'success' && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    needs: [unit, changes]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/test_state_machine_local.py -v
        env:
          GEYSER_SFN_LOCAL: "1"

  # ALIGNER=giraffe (#146): the geyser-giraffe image (geyser-app + vg + kmc) on the synthetic pangenome graph,
  # single-end, paired-end and whole-graph mapping, each called with bcftools against the planted SNPs. Only on
  # PRs and manual runs, like the DeepVariant job: make_test_data.py --pangenome pulls the ~1 GB vg image.
  giraffe:
    name: Giraffe align end-to-end (Docker, synthetic graph)
    if: >-
      ${{ !cancelled() && needs.unit.result == 'success' && needs.changes.outputs.docs_only != 'true'
      && ((github.event_name == 'pull_request' && !github.event.pull_request.draft)
      || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    needs: [unit, changes]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - uses: docker/setup-buildx-action@v4
      # Reads the cache the end-to-end job writes on main.
      - name: Build geyser-app (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: geyser-app
          load: true
          no-cache: ${{ inputs.no_cache == true }}
          cache-from: type=gha,scope=geyser-app
      # Two downloads on top of geyser-app. FROM geyser-app is the image loaded above, which only the daemon's own
      # builder ("default") can see: setup-buildx-action made its container builder the default for docker build.
      - run: docker buildx build --builder default --load -f app-giraffe/Dockerfile -t geyser-giraffe .
      - run: pytest tests/test_e2e_giraffe.py -v
        env:
          GEYSER_GIRAFFE_E2E: "1"

  # DeepVariant on the CPU image (runners have no GPU). Same commands and storage wiring as the GPU
  # image, so this catches integration breakage. Only on PRs and manual runs: the base image is a
  # ~2 GB pull. The GPU path is tested locally with GEYSER_GPU_E2E=1 before merging.
  deepvariant-cpu:
    name: DeepVariant end-to-end (CPU image, synthetic data)
    if: >-
      ${{ !cancelled() && needs.unit.result == 'success' && needs.changes.outputs.docs_only != 'true'
      && ((github.event_name == 'pull_request' && !github.event.pull_request.draft)
      || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    needs: [unit, changes]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - uses: docker/setup-buildx-action@v4
      # Reads the cache the end-to-end job writes on main.
      - name: Build geyser-app (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: geyser-app
          load: true
          no-cache: ${{ inputs.no_cache == true }}
          cache-from: type=gha,scope=geyser-app
      # Not cached: the ~2 GB base image dominates and our two layers on top are small, so exporting
      # the image out of Buildx would cost more than the cache saves. Plain docker build on the daemon.
      - run: docker build -f app-deepvariant/Dockerfile --build-arg DV_TAG=1.10.0 -t geyser-deepvariant-cpu .
      - run: pytest tests/test_e2e_deepvariant.py -v
        env:
          GEYSER_DV_E2E: "1"
