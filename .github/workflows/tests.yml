name: Tests

# Offline tests only: no AWS credentials, no OIDC, nothing deployed.
on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  end-to-end:
    name: Pipeline end-to-end (Docker, synthetic data)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: docker build -f Dockerfile -t geyser-app .
      - run: pytest tests/test_e2e_docker.py -v
        env:
          GEYSER_E2E: "1"
