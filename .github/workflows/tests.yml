name: Tests

# Offline tests only: no AWS credentials, no OIDC, nothing deployed.
on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  end-to-end:
    name: Pipeline end-to-end (Docker, synthetic data)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - uses: docker/setup-buildx-action@v3
      # Layers cached in the GitHub Actions cache: a push that only changes app/ rebuilds in seconds
      # instead of reinstalling the tools. PRs read their branch's cache, then main's.
      - name: Build geyser-app (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: geyser-app
          load: true
          cache-from: type=gha,scope=geyser-app
          cache-to: type=gha,scope=geyser-app,mode=max
      - run: pytest tests/test_e2e_docker.py -v
        env:
          GEYSER_E2E: "1"

  # DeepVariant on the CPU image (runners have no GPU). Same commands and storage wiring as the GPU
  # image, so this catches integration breakage. Only on PRs and manual runs: the base image is a
  # ~2 GB pull. The GPU path is tested locally with GEYSER_GPU_E2E=1 before merging.
  deepvariant-cpu:
    name: DeepVariant end-to-end (CPU image, synthetic data)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - uses: docker/setup-buildx-action@v3
      # Reads the end-to-end job's geyser-app cache; only the end-to-end job writes it.
      - name: Build geyser-app (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: geyser-app
          load: true
          cache-from: type=gha,scope=geyser-app
      # The DeepVariant base image is still pulled each run (~2 GB); only our layers on top are cached.
      - name: Build geyser-deepvariant-cpu (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app-deepvariant/Dockerfile
          build-args: DV_TAG=1.10.0
          tags: geyser-deepvariant-cpu
          load: true
          cache-from: type=gha,scope=geyser-deepvariant-cpu
          cache-to: type=gha,scope=geyser-deepvariant-cpu,mode=max
      - run: pytest tests/test_e2e_deepvariant.py -v
        env:
          GEYSER_DV_E2E: "1"
