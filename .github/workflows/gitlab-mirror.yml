name: GitLab mirror

# One-way mirror: GitHub is the source of truth, and this workflow pushes main and the v* release tags to
# gitlab.com/<GITLAB_NAMESPACE>/Geyser-Genomics, where .gitlab-ci.yml runs lint and the unit tests on GitLab's
# runners. GitLab's free tier can't pull-mirror from GitHub, so GitHub pushes.
#
# Needs, set by the maintainer (never in a file, never printed):
#   secret   GITLAB_TOKEN      a GitLab project access token: role Maintainer, scope write_repository
#   variable GITLAB_NAMESPACE  the GitLab user or group that owns the project
# Without either, the job ends with a notice instead of failing (forks, or before the mirror is set up).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Pushes are sequential: a newer push waits for the one in progress instead of racing it. Never cancelled, so
# every main commit and tag gets mirrored.
concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Push main and tags to GitLab
    runs-on: ubuntu-latest
    steps:
      - name: Check the mirror is configured
        id: config
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_NAMESPACE: ${{ vars.GITLAB_NAMESPACE }}
        run: |
          if [ -z "$GITLAB_TOKEN" ] || [ -z "$GITLAB_NAMESPACE" ]; then
            echo "::notice::GitLab mirror not configured (secret GITLAB_TOKEN and variable GITLAB_NAMESPACE); skipping"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Full history and every tag. persist-credentials: false, so GitHub's own token is not left in the git
      # config of a job that talks to another host.
      - uses: actions/checkout@v7
        if: steps.config.outputs.configured == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      # No --mirror, no --force: only main and the v* tags, and only as fast-forwards. If GitLab's main has
      # diverged (someone pushed there), this fails loudly instead of overwriting it. The token stays in the
      # environment (GitHub masks it in logs) and is never echoed; no `set -x`.
      - name: Push to GitLab
        if: steps.config.outputs.configured == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_NAMESPACE: ${{ vars.GITLAB_NAMESPACE }}
        run: |
          remote="https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_NAMESPACE}/Geyser-Genomics.git"
          git push "$remote" "refs/remotes/origin/main:refs/heads/main" 'refs/tags/v*:refs/tags/v*'
          echo "Mirrored main ($(git rev-parse --short origin/main)) and $(git tag -l 'v*' | wc -l) v* tags to gitlab.com/${GITLAB_NAMESPACE}/Geyser-Genomics"
